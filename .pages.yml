media:
  input: public/assets/images
  output: /assets/images
  categories: [ "image" ]
content:
  - name: posts
    label: Articles de blog
    type: collection
    path: _posts
    filename: "{fields.slug}.md"
    view:
      fields: [ title, tag, date ]
      primary: title
    fields:
      - { name: title, label: Titre (H1, ~60 caractères max), type: string, required: true }
      - { name: slug, label: "Adresse de l'article (ex. metcon-x-explique, sans accents)", type: string, required: true, pattern: { regex: "^[a-z0-9]+(-[a-z0-9]+)*$", message: "Minuscules, chiffres et tirets uniquement" } }
      - { name: excerpt, label: Résumé (meta description, ~155 caractères), type: text, required: true }
      - name: tag
        label: Catégorie
        type: select
        required: true
        options:
          values: [ Force, Endurance, Nutrition, Format, Mental ]
      - { name: date, label: Date de publication, type: date, required: true }
      - { name: updated, label: Date de mise à jour (optionnel), type: date }
      - { name: author, label: Auteur (optionnel), type: string }
      - { name: coverImage, label: Image de couverture (optionnel, 1200×630), type: image }
      - { name: summary, label: "Ce qu'il faut retenir (2-3 phrases, affiché avant le sommaire)", type: text }
      - { name: body, label: "Contenu (les titres H2, H3, H4 forment le sommaire automatiquement)", type: rich-text }
      - name: faq
        label: FAQ (affichée en fin d'article)
        type: object
        list: true
        fields:
          - { name: question, label: Question, type: string }
          - { name: answer, label: Réponse, type: text }

  - name: events
    label: Préparation ATHX (pages villes)
    type: collection
    path: _events
    view:
      fields: [ menuLabel, dates ]
      primary: menuLabel
    fields:
      - { name: title, label: "Titre SEO (onglet et résultats Google)", type: string, required: true }
      - { name: heading, label: "Titre affiché (H1 court, ex. Préparation ATHX Paris 2027)", type: string }
      - { name: menuLabel, label: "Nom court (pied de page, ex. Préparation ATHX Paris)", type: string, required: true }
      - { name: city, label: Ville, type: string, required: true }
      - { name: kicker, label: Surtitre, type: string }
      - { name: dates, label: "Dates affichées (ex. 13 et 14 février 2027)", type: string, required: true }
      - { name: startDate, label: Premier jour de la compétition, type: date, required: true }
      - { name: venue, label: Lieu, type: string }
      - { name: prepStart, label: Début de préparation conseillé, type: date }
      - { name: excerpt, label: "Résumé (meta description, ~155 caractères)", type: text, required: true }
      - { name: summary, label: Ce qu'il faut retenir, type: text }
      - { name: heroImage, label: Photo de l'en-tête, type: image }
      - { name: heroImageAlt, label: Description de la photo, type: string }
      - { name: ctaImage, label: Photo de l'encart programme (milieu de page), type: image }
      - { name: updated, label: Date de mise à jour, type: date }
      - { name: body, label: "Contenu (les H2/H3/H4 forment le sommaire ; l'encart programme se place avant le H2 du milieu)", type: rich-text }
      - name: faq
        label: FAQ
        type: object
        list: true
        fields:
          - { name: question, label: Question, type: string }
          - { name: answer, label: Réponse, type: text }

  - name: pages
    label: Pages (mentions légales, CGV…)
    type: collection
    path: _pages
    view:
      fields: [ title ]
    fields:
      - { name: title, label: Titre, type: string, required: true }
      - { name: description, label: Description (SEO), type: text }
      - { name: body, label: Contenu, type: rich-text }

  - name: home
    label: Page d'accueil
    type: file
    path: _data/home.json
    fields:
      - name: hero
        label: En-tête
        type: object
        fields:
          - { name: kicker, label: Surtitre, type: string }
          - { name: title, label: "Titre (H1) — un retour à la ligne = une ligne", type: text }
          - { name: lede, label: Texte d'introduction, type: text }
          - { name: offerNote, label: Mention sous le prix, type: string }
          - { name: features, label: Contenu de l'offre, type: string, list: true }
          - { name: image, label: "Photo de l'en-tête (portrait, sujet sur la droite)", type: image }
          - { name: imageAlt, label: Description de la photo (accessibilité et SEO), type: string }
      - name: stats
        label: Chiffres clés
        type: object
        list: true
        fields:
          - { name: value, label: Valeur, type: string }
          - { name: label, label: Légende, type: string }
      - name: personas
        label: Section « Pour chaque profil »
        type: object
        fields:
          - { name: title, label: Titre, type: text }
          - { name: lede, label: Introduction, type: text }
          - name: items
            label: Profils
            type: object
            list: true
            fields:
              - { name: image, label: Photo (portrait), type: image }
              - { name: label, label: Étiquette, type: string }
              - { name: title, label: Titre, type: string }
              - { name: text, label: Texte, type: text }
      - name: format
        label: Section « Le format »
        type: object
        fields:
          - { name: title, label: Titre, type: text }
          - { name: lede, label: Introduction, type: text }
          - name: zones
            label: Zones
            type: object
            list: true
            fields:
              - { name: name, label: Nom, type: string }
              - { name: description, label: Description, type: text }
              - { name: duration, label: Durée, type: string }
      - name: program
        label: Section « Le programme »
        type: object
        fields:
          - { name: title, label: Titre, type: text }
          - { name: lede, label: Introduction, type: text }
          - name: blocks
            label: Blocs
            type: object
            list: true
            fields:
              - { name: title, label: Titre, type: string }
              - { name: description, label: Description, type: text }
      - name: cta
        label: Section achat (calculateur de PR)
        type: object
        fields:
          - { name: title, label: Titre, type: text }
          - { name: lede, label: Introduction, type: text }
      - name: faq
        label: FAQ
        type: object
        list: true
        fields:
          - { name: question, label: Question, type: string }
          - { name: answer, label: Réponse, type: text }
      - { name: finalCta, label: Phrase d'appel final, type: string }
      - { name: finalImage, label: Photo de fond de l'appel final, type: image }

  - name: about
    label: Qui suis-je
    type: file
    path: _data/about.json
    fields:
      - { name: name, label: Nom, type: string, required: true }
      - { name: kicker, label: Surtitre, type: string }
      - { name: title, label: Titre de la page (H1), type: string }
      - { name: headline, label: "Accroche (ex. 1er de la Strength zone…)", type: string }
      - { name: bio, label: "Bio courte (bloc auteur en bas des articles)", type: text }
      - { name: intro, label: Introduction, type: text }
      - { name: paragraphs, label: Paragraphes, type: text, list: true }
      - name: results
        label: Résultats (chiffres)
        type: object
        list: true
        fields:
          - { name: value, label: Valeur, type: string }
          - { name: label, label: Légende, type: string }
      - { name: proofImage, label: Capture du classement, type: image }
      - { name: proofCaption, label: Légende de la capture, type: string }
      - { name: photo, label: Photo principale, type: image }
      - { name: avatar, label: "Photo ronde du bloc auteur (carrée, centrée sur le visage)", type: image }
      - name: photos
        label: Photos du slider
        type: object
        list: true
        fields:
          - { name: image, label: Photo, type: image }
          - { name: caption, label: Légende, type: string }

  - name: site
    label: Réglages du site
    type: file
    path: _data/site.json
    fields:
      - { name: name, label: Nom du site, type: string, required: true }
      - { name: url, label: "Adresse du site (ex. https://preparation-athx.fr)", type: string, required: true }
      - { name: title, label: Titre SEO de la page d'accueil, type: string }
      - { name: description, label: Description SEO de la page d'accueil (~155 caractères), type: text }
      - { name: price, label: Prix du programme (€), type: number, required: true }
      - { name: comparePrice, label: "Ancien prix barré (€) — uniquement s'il a réellement été pratiqué", type: number }
      - { name: buyUrl, label: "Lien de paiement Stripe (https://buy.stripe.com/…)", type: string }
      - { name: sessionsPerWeek, label: "Séances par semaine dans le programme (données structurées Google)", type: number }
      - { name: sessionMinutes, label: "Durée moyenne d'une séance en minutes (données structurées Google)", type: number }
      - { name: newsletterAction, label: URL du formulaire newsletter (Brevo, Mailchimp…), type: string }
      - { name: instagram, label: Lien Instagram, type: string }
      - { name: disclaimer, label: Mention d'indépendance (pied de page), type: text }
